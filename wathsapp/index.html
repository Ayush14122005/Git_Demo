<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WhatsApp Sign In</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-box">
  <h1>WhatsApp</h1>
  <p>Sign in to continue</p>

  <form>

  </form>

  <a href="#">Forgot password?</a>
</div>

</body>
</html>
